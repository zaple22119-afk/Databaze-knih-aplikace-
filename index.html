<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Knihovna</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>

    <div id="loginScreen">
        <div class="login-box">
            <h1>Moje Knihovna</h1>
            <div id="loginError" class="error-msg"></div>
            <input type="text" id="usernameInput" placeholder="Uživatelské jméno" autocomplete="username">
            <input type="password" id="passwordInput" placeholder="Heslo">
            <button class="btn-primary" onclick="login()">Přihlásit se</button>
            <button class="btn-secondary" onclick="register()">Vytvořit účet</button>
        </div>
    </div>

    <header class="mobile-header">
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <strong>Knihovna</strong>
        <div style="width: 24px;"></div>
    </header>

    <div id="appScreen">
        <aside class="sidebar" id="sidebar">
            <h2>Knihovna</h2>
            <ul id="menuList">
                <li class="active" onclick="handleMenuClick(this, 'all')">Všechny knihy</li>
                <li onclick="handleMenuClick(this, 'owned')">Moje knihy</li>
                <li onclick="handleMenuClick(this, 'read')">Přečtené</li>
                <li onclick="handleMenuClick(this, 'wishlist')">Wishlist</li>
            </ul>
            
            <div class="user-info">
                <div>Uživatel: <b id="loggedUserName"></b></div>
                <div class="logout-btn" onclick="logout()">Odhlásit se</div>
            </div>
        </aside>

        <main class="main-content">
            <div class="header-top">
                <h1 id="pageTitle">Všechny knihy</h1>
                <input type="text" id="searchInput" class="search-bar" placeholder="Hledat knihu nebo autora..." onkeyup="searchBooks()">
            </div>
            
            <div class="books-grid" id="booksGrid"></div>
        </main>

        <aside class="right-panel">
            <h3>Filtry</h3>
            <ul id="genreList">
                </ul>
        </aside>

        <div class="floating-add" onclick="openModal()">+</div>
    </div>

    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <h2 id="modalTitle">Nová kniha</h2>
            <form id="bookForm" onsubmit="saveBook(event)">
                <input type="hidden" id="bookId">
                
                <div class="form-group">
                    <label>Název</label>
                    <input type="text" id="bTitle" required>
                </div>

                <div class="form-group">
                    <label>Autor</label>
                    <input type="text" id="bAuthor" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Formát</label>
                        <select id="bFormat">
                            <option value="Fyzická">Fyzická</option>
                            <option value="E-book">E-book</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stav</label>
                        <select id="bReadStatus">
                            <option value="Nepřečteno">Nepřečteno</option>
                            <option value="Ve čtení">Rozečteno</option>
                            <option value="Dočteno">Dočteno</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Vlastnictví</label>
                    <select id="bOwnership">
                        <option value="Vlastní">Vlastním</option>
                        <option value="Wishlist">Wishlist</option>
                        <option value="Půjčeno (cizí)">Mám půjčeno</option>
                    </select>
                </div>

                <div id="deleteBtnContainer" class="hidden">
                    <button type="button" class="btn-delete" onclick="deleteBook()">🗑️ Smazat knihu</button>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Zrušit</button>
                    <button type="submit" class="btn-save">Uložit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
